spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/newbank_auth
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret-key=your-256-bit-secret-key-change-this-in-production-environment-please
jwt.refresh-key=your-256-bit-refresh-key-change-this-in-production-environment-please
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000

cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.root=INFO
logging.level.com.newbank=DEBUG
