# Active when SPRING_PROFILES_ACTIVE=docker
# All values come from environment variables set in docker-compose

server.port=8081

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret-key=${JWT_SECRET}
jwt.refresh-key=${JWT_REFRESH}

allowed.origins=${ALLOWED_ORIGINS:http://localhost:80}
